<div class="container-fluid mt-5 best-stocks-container">

  <h2 class="text-center mb-4 main-title">📈 Best Stocks</h2>

  <!-- Normal Search -->
  <div class="row justify-content-center mb-4">
    <div class="col-md-6">
      <input type="text" class="form-control search-box" placeholder="🔍 Search by Stock Name or Full Name"
        [(ngModel)]="searchText" (ngModelChange)="loadStocks(1)">
    </div>
  </div>

  <!-- Advanced Search -->
  <div class="card advanced-card mb-4">
    <div class="card-body">
      <h5 class="mb-3 advanced-title">Advanced Search</h5>
      <div class="row g-3">

        <div class="col-md-3">
          <select class="form-select custom-input" [(ngModel)]="selectedCategory" (change)="loadStocks(1)">
            <option value="">All Categories</option>
            <option *ngFor="let category of categories" [value]="category">
              {{category}}
            </option>

          </select>
        </div>

        <div class="col-md-3">
          <select class="form-select custom-input" [(ngModel)]="selectedMarket" (change)="loadStocks(1)">
            <option value="">All Markets</option>
            <option *ngFor="let market of markets" [value]="market">
              {{market}}
            </option>
          </select>
        </div>

        <div class="col-md-3">
          <input type="number" class="form-control custom-input" placeholder="Min Price" [(ngModel)]="minPrice"
            (change)="loadStocks(1)">
        </div>

        <div class="col-md-3">
          <input type="number" class="form-control custom-input" placeholder="Max Price" [(ngModel)]="maxPrice"
            (change)="loadStocks(1)">
        </div>

      </div>
    </div>
  </div>

  <!-- Stock Cards -->
  <div class="row">
    <div class="col-lg-4 col-md-6 mb-4" *ngFor="let stock of stocks">
      <div class="card stock-card h-100">
        <div class="card-body">

          <div class="d-flex justify-content-between align-items-center mb-2">
            <h5 class="stock-name">{{ stock.stockName }}</h5>
            <span class="badge market-badge">{{ stock.market }}</span>
          </div>

          <h6 class="stock-full-name">{{ stock.fullName }}</h6>

          <div class="stock-details mt-3">
            <p><strong>Category:</strong> {{ stock.category }}</p>
            <p><strong>Sub Category:</strong> {{ stock.subCategory }}</p>
          </div>

          <div class="price-section mt-3">
            <p class="current-price">
              Current Price: ₹{{ stock.currentPrice }}
            </p>
            <p class="actual-price">
              Actual Price: ₹{{ stock.actualPrice }}
            </p>
          </div>

        </div>
      </div>
    </div>
  </div>
  <nav class="mt-4">

    <ul class="pagination justify-content-center">

      <!-- Previous -->
      <li class="page-item" [class.disabled]="currentPage === 1">
        <button class="page-link" (click)="prevPage()">
          Previous
        </button>
      </li>

      <!-- Page numbers -->
      <li class="page-item" *ngFor="let page of pages" [class.active]="page === currentPage">

        <button class="page-link" (click)="goToPage(page)">
          {{page}}
        </button>

      </li>

      <!-- Next -->
      <li class="page-item" [class.disabled]="currentPage === totalPages">

        <button class="page-link" (click)="nextPage()">
          Next
        </button>

      </li>

    </ul>

  </nav>

</div>
